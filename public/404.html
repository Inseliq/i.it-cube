<!doctype html>

<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IT-Cube</title>
</head>

<body>

  <script>
    const base = '/i.it-cube/'

    const currentPath =
      window.location.pathname +
      window.location.search +
      window.location.hash

    sessionStorage.setItem(
      'spa-redirect',
      currentPath,
    )

    window.location.replace(base)
  </script>

</body>

</html>
